<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OnlyFans Unread Messages for Parker Martin</title>
    <link rel="stylesheet" href="/assets/styles.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="container">
        <h1>OnlyFans Unread Messages for Parker Martin</h1>
        <p class="subheader">
          Account ID: <code id="accountId">acct_6c513bcfe14346399f6bf0f5a0bffafb</code>
        </p>

        <div class="toolbar">
          <button id="btnLoad" class="btn primary" title="Fetches last 10 days of unread and loads 24 recent messages for context.">Get Unread Messages</button>
          <button id="btnSendAll" class="btn" title="Sends all prepared replies, adds to selected lists first, and applies PPV prices if set.">Send to All</button>
          <div class="spacer"></div>
          <label class="days">
            Days
            <input id="daysInput" type="number" min="1" max="30" step="1" value="10" />
          </label>
        </div>

        <div id="topStatus" class="top-status" aria-live="polite"></div>
      </div>
    </header>

    <main class="container">
      <div id="messages" class="cards"></div>
    </main>

    <footer class="container footer">
      <small>
        All OnlyFans and OpenAI requests are made server-side. API keys are never exposed to the browser.
      </small>
    </footer>

    <script type="module" src="/assets/app.js"></script>
  </body>
</html>
